<!doctype html>
<html lang="en" data-theme="biomarkers">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040506">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>ALYX Bio</title>
<style>
:root {
  color-scheme: dark;
  --base: #080808;
  --paper: var(--base);
  --surface: #161310;
  --ink: #f7f1e9;
  --muted: #c7beb3;
  --line: #d3bca447;
  --focus: #f5c992;
  --accent: #eccaa3;
  --action: #f0d9bd;
  --action-ink: #21180f;
  --serif: Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  font: 16px/1.5 var(--sans);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { background: var(--base); -webkit-text-size-adjust: 100%; }
body { margin: 0; color: var(--ink); overflow: hidden; }
button, input, a { font: inherit; }
a { color: inherit; }
button { color: inherit; cursor: pointer; }
h1, h2, h3, figure, p { margin: 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
img { display: block; width: 100%; }

.backdrop {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  background: radial-gradient(ellipse at 80% 54%, #261a12 0, #100e0d 42%, #080808 78%);
  pointer-events: none;
}
.backdrop::before {
  position: absolute;
  inset: -30% -14%;
  content: "";
  background: repeating-radial-gradient(ellipse at 80% 81%, transparent 0 19px, #c89c6647 20px, transparent 21px 27px);
  mask-image: radial-gradient(ellipse 40% 49% at 77% 60%, #000, transparent 90%);
  transform-origin: 72% 53%;
  animation: backdrop-orbit 24s ease-in-out infinite;
  opacity: .46;
}
.backdrop::after {
  position: absolute;
  inset: 0;
  content: "";
  background: linear-gradient(100deg, #0808081a 47%, transparent 85%), radial-gradient(ellipse at 47% 49%, #08080866, transparent 76%);
}
@keyframes backdrop-orbit {
  0%, 100% { transform: translate(3%, 3%) rotate(-8deg) scale(1.01); }
  50% { transform: translate(-3%, -3%) rotate(6deg) scale(1.08); }
}

.app { height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.app-header {
  width: min(1120px, calc(100% - 48px));
  min-height: 68px;
  margin-inline: auto;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
}
.wordmark, .back-button {
  min-height: 44px;
  padding: 5px 0;
  border: 0;
  background: transparent;
  color: var(--ink);
}
.wordmark {
  justify-self: start;
  font-size: .9rem;
  font-weight: 790;
  letter-spacing: .17em;
  white-space: nowrap;
}
.wordmark span { font-weight: 580; color: var(--muted); }
.back-button { grid-column: 3; justify-self: end; font-size: .86rem; font-weight: 680; }
.back-button span { margin-right: 4px; }
.progress { grid-column: 2; display: flex; gap: 5px; }
.progress span { width: 15px; height: 3px; border-radius: 99px; background: #fff3e83b; }
.progress span[data-active] { background: var(--accent); }
.panes {
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: auto;
  overscroll-behavior-y: contain;
  padding: 8px 24px max(24px, env(safe-area-inset-bottom));
}
.screen {
  flex: 0 0 auto;
  width: min(100%, 790px);
  margin: auto;
  padding-block: 14px;
  animation: appear .19s ease-out both;
}
@keyframes appear {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}
.screen h1 {
  font: 500 clamp(2.75rem, 6vw, 5.35rem)/.99 var(--serif);
  letter-spacing: -.065em;
  text-wrap: balance;
}
.screen h1:focus { outline: none; }
.home-screen { padding: 8px 0 36px; text-align: center; }
.home-screen em { display: block; color: var(--accent); font-weight: inherit; }
.home-actions { display: grid; gap: 9px; width: min(100%, 335px); margin: clamp(24px, 4vh, 36px) auto 0; }
.button, .secondary-button, .text-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 47px;
  padding: 10px 15px;
  border: 1px solid transparent;
  border-radius: 8px;
  text-decoration: none;
  font-size: .92rem;
  font-weight: 730;
  line-height: 1.25;
}
.button { color: var(--action-ink); background: var(--action); }
.button:not(:disabled):hover { background: #fff1de; }
.button:disabled { opacity: .54; cursor: default; }
.secondary-button { color: var(--ink); border-color: #d6bda669; background: #161311cc; }
.secondary-button:hover { background: #2c2119; }
.text-button { display: inline-flex; color: var(--ink); background: transparent; text-decoration: underline; text-underline-offset: 4px; }
.screen-heading { margin-bottom: 16px; }
.screen-heading h1 { font-size: clamp(2.25rem, 5.1vw, 4.2rem); text-wrap: balance; }
.screen-heading p { margin-top: 7px; font-size: .94rem; color: var(--muted); }
.chooser-screen { width: min(100%, 630px); }
.goal-list { display: grid; gap: 8px; }
.goal-button {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 9px;
  padding: 11px 13px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #151210e8;
  text-align: left;
}
.goal-button strong, .goal-button small { display: block; }
.goal-button strong { font-size: .92rem; }
.goal-button small { margin-top: 3px; color: var(--muted); font-size: .77rem; }
.goal-mark { display: grid; place-items: center; flex: none; width: 22px; height: 22px; border: 1px solid #d6bda677; border-radius: 5px; }
.goal-button[aria-pressed="true"] { border-color: var(--accent); background: #2b2118; }
.goal-button[aria-pressed="true"] .goal-mark { background: var(--accent); color: var(--action-ink); border-color: var(--accent); }
.goal-button[aria-pressed="true"] .goal-mark::before { content: "✓"; font-weight: 800; }
.step-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 7px; margin-top: 13px; }
.search-label { display: block; margin: 0 0 5px; font-size: .8rem; color: var(--muted); }
#test-search { width: 100%; min-height: 44px; padding: 8px 11px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #100e0d; }
#test-search::placeholder { color: #a99d92; }
.test-list { display: grid; gap: 7px; }
.test-option {
  display: grid;
  grid-template-columns: minmax(0,1fr) auto;
  gap: 4px 10px;
  align-items: center;
  padding: 8px 10px 8px 12px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #171411ed;
}
.test-option h2 { font-size: .91rem; line-height: 1.2; }
.test-option p { color: var(--muted); font-size: .77rem; line-height: 1.35; margin-top: 3px; }
.test-option-method { display: block; color: #edc8a2; margin-top: 3px; font-size: .7rem; }
.test-actions { display: flex; flex-wrap: wrap; gap: 4px; justify-content: end; }
.test-actions button {
  min-height: 44px;
  padding: 6px 8px;
  border: 1px solid #dfc3a661;
  border-radius: 6px;
  background: #261e17;
  color: var(--ink);
  font-size: .73rem;
  font-weight: 740;
}
.test-actions button:hover { background: #3a2a1d; }
.list-link { margin-top: 6px; min-height: 44px; padding-inline: 0; }
.empty-state { padding: 12px; color: var(--muted); font-size: .83rem; }
.preview-tools { position: fixed; inset: auto 13px 13px auto; }
.preview-tools .secondary-button { min-height: 39px; font-size: .73rem; }
.funnel-dialog { width: min(480px, calc(100vw - 28px)); max-height: calc(100dvh - 28px); margin: auto; border: 1px solid var(--line); border-radius: 12px; padding: 18px; background: var(--surface); color: var(--ink); }
.funnel-dialog::backdrop { background: #000b; }
.funnel-head { display: flex; align-items: center; justify-content: space-between; gap: 9px; }
.funnel-dialog h2 { font-size: 1.3rem; }
.funnel-dialog p, .funnel-dialog li { margin-top: 7px; color: var(--muted); font-size: .83rem; }
.funnel-dialog ol { padding-inline-start: 26px; }
@media (max-width: 600px) {
  .app-header { width: calc(100% - 34px); min-height: 56px; }
  .panes { padding: 4px 16px max(17px, env(safe-area-inset-bottom)); }
  .home-screen h1 { font-size: clamp(3.1rem, 13vw, 4.7rem); }
  .screen-heading h1 { font-size: clamp(2.25rem, 9vw, 3.2rem); }
  .home-screen { padding-bottom: 26px; }
  .step-actions .button { flex: 1 0 100%; }
  .screen-heading { margin-bottom: 12px; }
}
@media (max-width: 360px) {
  .goal-button { padding: 8px 10px; }
  .test-actions { max-width: 130px; }
}
@media (prefers-reduced-motion: reduce) {
  .screen, .backdrop::before { animation: none; }
}

.studio { position: relative; overflow: hidden; }
.studio-poster, .studio-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.studio-poster { object-fit: cover; }
.studio-canvas { display: block; visibility: hidden; }
.studio.has-studio .studio-canvas { visibility: visible; }
.studio.has-studio .studio-poster { visibility: hidden; }

html[data-theme] {
  --action-hover: #fff1de;
  --checkout-hover: #f8e7d5;
  --control: #161311cc;
  --control-hover: #2c2119;
  --control-line: #d6bda669;
  --goal-fill: #151210e8;
  --chosen-fill: #2b2118;
  --search-fill: #100e0d;
  --placeholder: #a99d92;
  --row-fill: #171411ed;
  --row-action: #261e17;
  --row-action-hover: #3a2a1d;
  --row-action-line: #dfc3a661;
  --kit-action: #211912;
  --kit-action-hover: #31251a;
  --kit-action-line: #e7c5a35e;
}

html[data-theme="hearth"] {
  --base: #090807;
  --ink: #f3ede4;
  --hearth-ring: #c5a47c47;
}

html[data-theme="hearth"] .backdrop::before {
  background: repeating-radial-gradient(ellipse at 80% 81%, transparent 0 19px, var(--hearth-ring) 20px, transparent 21px 27px);
  animation-duration: 12s;
}

html[data-theme]:not([data-theme="hearth"]) {
  --action-ink: #101114;
  --action-hover: #ffffff;
  --checkout-hover: #f8f9fb;
  --control: #121316db;
  --control-hover: #202227;
  --control-line: #b3b9c36f;
  --goal-fill: #111215ed;
  --chosen-fill: #22252b;
  --search-fill: #101115;
  --placeholder: #a7aab3;
  --row-fill: #121316ed;
  --row-action: #1d2025;
  --row-action-hover: #2a2e35;
  --row-action-line: #b3b9c36f;
  --kit-action: #1a1c20;
  --kit-action-hover: #282c31;
  --kit-action-line: #b3b9c36f;
}

html[data-theme="monochrome"],
html[data-theme="unboxing-mono"] {
  --base: #050505;
  --surface: #101010;
  --ink: #f5f5f5;
  --muted: #c2c2c2;
  --line: #ababab54;
  --focus: #f5f5f5;
  --accent: #f5f5f5;
  --action: #f5f5f5;
  --control: #111111e8;
  --control-hover: #222222;
  --control-line: #cecece67;
  --goal-fill: #101010ed;
  --chosen-fill: #242424;
  --search-fill: #111111;
  --placeholder: #a7a7a7;
  --row-fill: #141414ed;
  --row-action: #191919;
  --row-action-hover: #272727;
  --row-action-line: #b3b3b366;
  --kit-action: #191919;
  --kit-action-hover: #292929;
  --kit-action-line: #b3b3b36d;
}

html[data-theme="glass"] {
  --base: #07090b;
  --surface: #12181e;
  --ink: #eef1f4;
  --muted: #b9c3cc;
  --line: #8fa6bc60;
  --focus: #d1e6fa;
  --accent: #c0cfda;
  --action: #eef1f4;
  --control: #131a22db;
  --control-hover: #232d37;
  --control-line: #77828cbb;
  --goal-fill: #111720ed;
  --chosen-fill: #202c39;
  --search-fill: #10161e;
  --row-fill: #111720ed;
  --row-action: #1a2634;
  --row-action-hover: #283747;
  --kit-action: #1a222e;
  --kit-action-hover: #283547;
}

html[data-theme="silver"] {
  --base: #050506;
  --surface: #151619;
  --ink: #e5e7eb;
  --muted: #bfc2c8;
  --line: #9da3ab65;
  --focus: #eef0f3;
  --accent: #d0d4db;
  --action: #e5e7eb;
  --control: #17181ce3;
  --chosen-fill: #26282e;
}

html[data-theme="particles"],
html[data-theme="unboxing"],
html[data-theme="biomarkers"] {
  --base: #040506;
  --surface: #12151a;
  --ink: #f1f3f6;
  --muted: #bdc2cd;
  --line: #9ca3af64;
  --focus: #eef1f7;
  --accent: #d5dbe5;
  --action: #f1f3f6;
  --goal-fill: #111319ed;
  --row-fill: #111319f0;
}

html[data-theme="unboxing-mono"] {
  --base: #020202;
  --surface: #0d0d0d;
  --ink: #fff;
  --accent: #fff;
  --action: #fff;
  --action-ink: #101010;
  --checkout-hover: #f5f5f5;
}
html[data-theme="unboxing-mono"] .progress span { background: #ffffff3b; }
html[data-theme="unboxing-mono"] .progress span[data-active] { background: var(--accent); }

html[data-theme] .button:not(:disabled):hover { background: var(--action-hover); }
html[data-theme] .secondary-button { background: var(--control); border-color: var(--control-line); }
html[data-theme] .secondary-button:hover { background: var(--control-hover); }
html[data-theme] .goal-button { background: var(--goal-fill); }
html[data-theme] .goal-button[aria-pressed="true"] { background: var(--chosen-fill); }
html[data-theme] .goal-mark { border-color: var(--control-line); }
html[data-theme] .goal-button[aria-pressed="true"] .goal-mark { border-color: var(--accent); }
html[data-theme] #test-search { background: var(--search-fill); }
html[data-theme] #test-search::placeholder { color: var(--placeholder); }
html[data-theme] .test-option { background: var(--row-fill); }
html[data-theme] .test-option-method { color: var(--accent); }
html[data-theme] .test-actions button { background: var(--row-action); border-color: var(--row-action-line); }
html[data-theme] .test-actions button:hover { background: var(--row-action-hover); }
html[data-theme] .detail-screen .detail-kit-toggle { background: var(--kit-action); border-color: var(--kit-action-line); }
html[data-theme] .detail-screen .detail-kit-toggle:hover,
html[data-theme] .detail-screen .detail-kit-toggle[aria-expanded="true"] { background: var(--kit-action-hover); }
html[data-theme] .detail-screen .detail-action[href]:hover { background: var(--checkout-hover); color: var(--action-ink); }

html[data-theme="monochrome"] .backdrop {
  background: radial-gradient(ellipse at 77% 78%, #141414 0, #0a0a0a 33%, #050505 70%);
}
html[data-theme="monochrome"] .backdrop::before {
  inset: -20%;
  background:
    radial-gradient(ellipse 69% 15% at 62% 73%, #55555557 0, #25252540 37%, transparent 73%),
    radial-gradient(ellipse 22% 40% at 75% 50%, #27272760 0, transparent 86%);
  mask-image: none;
  opacity: .46;
  animation: charcoal-light 12s ease-in-out infinite;
}
html[data-theme="monochrome"] .backdrop::after {
  background: radial-gradient(ellipse at 43% 49%, #050505b8 8%, #05050522 51%, transparent 72%);
}
@keyframes charcoal-light {
  0%, 100% { transform: translate(1%, -2%) rotate(-12deg); }
  50% { transform: translate(-4%, 2%) rotate(-6deg); }
}

html[data-theme="glass"] .backdrop {
  background: radial-gradient(ellipse at 92% 64%, #15212b 0, #0b1015 37%, #07090b 73%);
}
html[data-theme="glass"] .backdrop::before {
  inset: -31% -23% -21% 31%;
  background:
    linear-gradient(126deg, transparent 30%, #546a7c14 38%, #a7bdcf46 45.2%, #c1d5e74d 45.4%, #24374788 46%, #17243085 51%, transparent 61%),
    linear-gradient(149deg, transparent 30%, #94abc31d 48.3%, #e2eef92c 48.6%, #0b151e64 49.2%, transparent 64%),
    linear-gradient(113deg, transparent 39%, #1d2a377a 49%, #77828c52 57.3%, #d0e3f531 57.6%, #19232d8a 58.5%, transparent 66%);
  mask-image: radial-gradient(ellipse 55% 53% at 69% 61%, #000 16%, #000e 50%, transparent 92%);
  opacity: .88;
  transform-origin: 63% 62%;
  animation: smoked-glass 11s ease-in-out infinite;
}
html[data-theme="glass"] .backdrop::after {
  background: radial-gradient(ellipse at 36% 51%, #07090bc4 0%, #07090b59 38%, transparent 71%);
}
@keyframes smoked-glass {
  0%, 100% { transform: translate(3%, 2%) rotate(-5deg); }
  50% { transform: translate(-3%, -4%) rotate(3deg); }
}

html[data-theme="silver"] .backdrop {
  background: radial-gradient(ellipse at 88% 72%, #18191b 0%, #0b0c0d 44%, #050506 79%);
}
html[data-theme="silver"] .backdrop::before {
  inset: -27% -25% -22% 28%;
  background:
    radial-gradient(ellipse 73% 93% at 25% 15%, #09090a 35%, #101113 53%, #1c1e21 60%, #92979e 70%, #b3b6bb 72.5%, #55595e 77.5%, #202124 82%, #0e0f11 87%, #6a6e74 96%, transparent 99%),
    linear-gradient(146deg, #0b0b0c 24%, #34363a 49%, #858991 67%, #0b0c0e 92%);
  mask-image: radial-gradient(ellipse 56% 57% at 76% 65%, #000 9%, #000d 36%, transparent 89%);
  opacity: .66;
  transform-origin: 73% 60%;
  animation: silver-fold 10.5s ease-in-out infinite;
}
html[data-theme="silver"] .backdrop::after {
  background: radial-gradient(ellipse at 41% 47%, #050506c4 3%, #0505067a 38%, transparent 75%);
}
@keyframes silver-fold {
  0%, 100% { transform: translate(3%, -3%) rotate(-9deg) scale(1.02); }
  50% { transform: translate(-4%, 4%) rotate(3deg) scale(1.07); }
}

html[data-theme="particles"] .backdrop,
html[data-theme="unboxing"] .backdrop,
html[data-theme="biomarkers"] .backdrop {
  background:
    radial-gradient(ellipse at 95% 22%, #10131a 0%, transparent 44%),
    radial-gradient(ellipse at 14% 89%, #13161d 0%, #080a0f 32%, transparent 65%),
    #040506;
}
html[data-theme="particles"] .backdrop::before,
html[data-theme="unboxing"] .backdrop::before,
html[data-theme="biomarkers"] .backdrop::before,
html[data-theme="unboxing-mono"] .backdrop::before { display: none; }
html[data-theme="particles"] .backdrop::after,
html[data-theme="unboxing"] .backdrop::after,
html[data-theme="biomarkers"] .backdrop::after {
  background:
    linear-gradient(180deg, #04050680, transparent 17%, transparent 85%, #0405065c),
    radial-gradient(ellipse 48% 62% at 48% 49%, #040506b0 0%, #04050680 35%, #04050624 71%, transparent 100%);
}
html[data-theme="unboxing-mono"] .backdrop {
  background:
    radial-gradient(ellipse at 95% 22%, #121212 0%, transparent 44%),
    radial-gradient(ellipse at 14% 89%, #151515 0%, #080808 32%, transparent 65%),
    #020202;
}
html[data-theme="unboxing-mono"] .backdrop::after {
  background:
    linear-gradient(180deg, #02020280, transparent 17%, transparent 85%, #0202025c),
    radial-gradient(ellipse 48% 62% at 48% 49%, #020202b0 0%, #02020280 35%, #02020224 71%, transparent 100%);
}
.theme-particles {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
}

@media (max-width: 680px) {
  html[data-theme="monochrome"] .backdrop::before {
    background: radial-gradient(ellipse 65% 16% at 73% 70%, #5555554b 0, #25252531 42%, transparent 81%);
  }
  html[data-theme="glass"] .backdrop::before {
    inset: -8% -38% -17% -4%;
    mask-image: radial-gradient(ellipse 61% 52% at 74% 67%, #000 10%, #000d 37%, transparent 88%);
  }
  html[data-theme="silver"] .backdrop::before {
    inset: -17% -42% -15% -8%;
    mask-image: radial-gradient(ellipse 59% 53% at 80% 72%, #000 10%, #000c 48%, transparent 89%);
  }
  html[data-theme="silver"] .backdrop::after {
    background: radial-gradient(ellipse at 55% 45%, #050506c4 0%, #05050683 35%, transparent 71%);
  }
  html[data-theme="particles"] .backdrop::after,
  html[data-theme="unboxing"] .backdrop::after,
  html[data-theme="biomarkers"] .backdrop::after {
    background:
      linear-gradient(180deg, #0405066e, transparent 15%, transparent 87%, #04050657),
      radial-gradient(ellipse 78% 36% at 48% 50%, #040506b8 0%, #04050675 40%, #0405061a 78%, transparent 100%);
  }
  html[data-theme="unboxing-mono"] .backdrop::after {
    background:
      linear-gradient(180deg, #0202026e, transparent 15%, transparent 87%, #02020257),
      radial-gradient(ellipse 78% 36% at 48% 50%, #020202b8 0%, #02020275 40%, #0202021a 78%, transparent 100%);
  }
}

html[data-theme] .backdrop[data-paused]::before { animation-play-state: paused; }

@media (prefers-reduced-motion: reduce) {
  html[data-theme] .backdrop::before { animation: none; }
}


.gate-wordmark { display: inline-flex; align-items: center; gap: .45em; }
.gate-title { min-block-size: 1.98em; }
.gate-label { text-align: left; color: var(--muted); font-size: .88rem; font-weight: 650; }
.gate-password {
  width: 100%;
  min-height: 47px;
  padding: 10px 14px;
  border: 1px solid var(--control-line);
  border-radius: 8px;
  color: var(--ink);
  background: var(--search-fill);
  font-size: 1rem;
}
.gate-status { min-height: 1.5rem; color: var(--muted); font-size: .88rem; }
.gate-status[data-error] { color: #ffc0bb; }
@media (max-height: 500px) {
  .home-screen { padding-block: 12px; }
  .home-actions { margin-top: 18px; }
}
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<div class="app">
  <header class="app-header">
    <p class="wordmark gate-wordmark">ALYX <span>BIO</span></p>
  </header>
  <main class="panes">
    <section class="screen home-screen" data-screen="home" aria-labelledby="gate-title">
      <h1 class="gate-title" id="gate-title" aria-label="Unlock ALYX Bio"></h1>
      <form class="home-actions" id="gate-form" method="post" action="https://alyx-password-gate.dorianhintz.chatgpt.site/unlock">
        <label class="gate-label" for="gate-password">Password</label>
        <input class="gate-password" id="gate-password" type="password" name="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required disabled>
        <button class="button" type="submit" disabled>Unlock site</button>
        <p class="gate-status" role="status" aria-live="polite" aria-atomic="true"></p>
        <noscript><p>Enable JavaScript to enter the password.</p></noscript>
      </form>
    </section>
  </main>
</div>
<script>
(() => {
  const backdrop = document.querySelector('.backdrop');
  if (!backdrop) return;

  const root = document.documentElement;
  const panes = document.querySelector('.panes');
  const detailScreen = panes?.querySelector('[data-screen="detail"]');
  const header = document.querySelector('.app-header');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const tau = 2 * Math.PI;
  const duration = 12000;
  const frameInterval = 1000 / 30;
  const initialPhase = .45;
  const palettes = [
    'rgba(112,122,138,.15)',
    'rgba(130,141,157,.22)',
    'rgba(154,165,181,.31)',
    'rgba(176,186,201,.41)',
    'rgba(194,203,215,.52)',
    'rgba(214,220,231,.63)',
    'rgba(232,236,243,.79)',
  ];
  const blackAndWhite = [
    'rgba(105,105,105,.15)',
    'rgba(132,132,132,.22)',
    'rgba(154,154,154,.31)',
    'rgba(181,181,181,.41)',
    'rgba(206,206,206,.52)',
    'rgba(230,230,230,.63)',
    'rgba(255,255,255,.79)',
  ];
  const isUnboxing = (name) => name === 'unboxing' || name === 'unboxing-mono';
  const usesParticles = (name) => name === 'particles' || name === 'biomarkers' || isUnboxing(name);
  let canvas;
  let context;
  let field;
  let viewport;
  let frame;
  let timestamp;
  let elapsed = 0;
  let theme;
  let revealTarget;
  let deviceScript;
  let biomarkerScript;
  let biomarkerReady = false;
  let biomarkerDetail = false;
  let copyMask;
  let copyNeedsMeasure = false;

  function randomSource() {
    let state = 0x348bf913;
    return () => {
      state = (Math.imul(1664525, state) + 1013904223) >>> 0;
      return state / 4294967296;
    };
  }

  function sweep(family, position, strand) {
    const waviness = .74 + .26 * Math.sin(position * 3.8 + family);
    if (family === 0) {
      return [
        -.18 + position * 1.36 + strand * .042,
        1.02 - position * 1.03 - .185 * Math.sin(position * tau + .08) + strand * .067 * waviness,
      ];
    }
    if (family === 1) {
      return [
        -.20 + position * 1.42 - strand * .036,
        .03 + position * .85 + .138 * Math.sin(position * tau + .48) + strand * .085 * waviness,
      ];
    }
    return [
      .16 + position * .68 - .17 * Math.sin(position * tau + .3) + strand * .083 * waviness,
      -.14 + position * 1.32 + strand * .024,
    ];
  }

  function particleField(dense) {
    const random = randomSource();
    const shell = [];
    function makePoint(angle, radius, height, surface, lid = false) {
      const z = Math.sin(angle) * radius;
      const x = Math.cos(angle) * radius;
      const edge = Math.abs(x) / .46;
      const light = Math.max(0, 1 - Math.abs(x - .26) / .46) * .24 + edge ** 6 * .21;
      const tint = surface + light + z * .17 + random() * .26;
      const family = Math.floor(random() * 3);
      const position = random();
      const strand = (random() - .5) * 2.8;
      const [dispersedX, dispersedY] = sweep(family, position, strand);
      shell.push({
        x, z, height, tint, lid,
        size: .47 + random() * .77,
        dispersedX, dispersedY,
        curve: (random() - .5) * 2,
        glimmer: .78 + random() * .22,
      });
    }

    const bodyCount = dense ? 2280 : 1570;
    for (let index = 0; index < bodyCount; index++) {
      const height = -.94 + ((index + random()) / bodyCount) * 1.89;
      const angle = random() * Math.PI - .10;
      const radius = (height > .71 ? .427 : .443) + (random() - .5) * .02;
      makePoint(angle, radius, height, .19);
    }
    const lidCount = dense ? 410 : 260;
    for (let index = 0; index < lidCount; index++) {
      makePoint(random() * tau, Math.sqrt(random()) * .401, -.958, .08, true);
    }
    // Layered contours describe the lip and lower seam at a glance.
    const contours = [
      { height: -.978, radius: .433, count: 200, tone: .40, lid: true },
      { height: -.925, radius: .449, count: 147, tone: .35 },
      { height: .689, radius: .443, count: 151, tone: .30 },
      { height: .729, radius: .426, count: 106, tone: .24 },
      { height: .959, radius: .423, count: 130, tone: .27 },
    ];
    for (const { height, radius, count, tone, lid } of contours) {
      const contourCount = dense ? Math.round(count * 1.55) : count;
      for (let index = 0; index < contourCount; index++) {
        const arc = height < 0 ? tau : Math.PI;
        const angle = ((index + random() * .96) / contourCount) * arc;
        makePoint(angle, radius + (random() - .5) * .023, height + (random() - .5) * .03, tone, lid);
      }
    }

    const ambient = [];
    const ambientCount = dense ? 4300 : 3450;
    for (let index = 0; index < ambientCount; index++) {
      const loose = index % 6 === 0;
      const family = index % 3;
      const position = random();
      const feather = (random() - .5) * 1.28;
      const strand = (Math.floor(random() * 12) - 5.5) * .37 + feather * .24;
      const [x, y] = loose ? [random(), random()] : sweep(family, position, strand);
      const crest = Math.exp(-(strand * strand) * .7);
      const tint = loose ? random() * .31 : .10 + crest * .34 + random() * .36;
      ambient.push({
        index, x, y, tint,
        size: .44 + random() * .79,
        driftX: (loose ? .009 : .024) * Math.sin(position * 8 + family),
        driftY: (loose ? .012 : .031) * Math.cos(position * 6.5 + strand),
      });
    }
    return {
      shell: shell.sort((first, second) => first.tint - second.tint),
      ambient: ambient.sort((first, second) => first.tint - second.tint),
    };
  }

  function ease(value) {
    const clamped = Math.max(0, Math.min(1, value));
    return clamped * clamped * (3 - 2 * clamped);
  }

  function positionReveal() {
    if (!isUnboxing(theme) || !viewport) return;
    const screen = panes?.querySelector('[data-screen]:not([hidden])');
    const method = screen?.querySelector('.studio')?.dataset.method;
    const { width, height, small, scale, centerX } = viewport;
    const top = (header?.getBoundingClientRect().bottom ?? 56) + 10;
    if (small) {
      const titleTop = (screen?.querySelector('h1')?.getBoundingClientRect().top ?? height * .38) - 15;
      const gap = titleTop - top;
      if (gap > 70) {
        const deviceScale = Math.min(scale * .62, gap * .75);
        revealTarget = { x: width * .31, y: top + gap * .48, scale: deviceScale, opacity: 1, method };
      } else {
        revealTarget = { x: width * .26, y: height * .20, scale: scale * .44, opacity: .24, method };
      }
      return;
    }

    revealTarget = {
      x: Math.max(width * .64, centerX - scale * .23),
      y: Math.max(top + scale * .28, height * .22),
      scale: Math.min(scale * .59, height * .24),
      opacity: 1,
      method,
    };
  }

  function textBounds(element) {
    const text = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
    const range = document.createRange();
    const bounds = [];
    for (let node = text.nextNode(); node; node = text.nextNode()) {
      if (!node.textContent.trim()) continue;
      range.selectNodeContents(node);
      bounds.push(...range.getClientRects());
    }
    return bounds;
  }

  function makeCopyMask(regions, width, height) {
    if (!regions.length) return undefined;

    const feather = 14;
    const left = Math.max(0, Math.floor(Math.min(...regions.map((rect) => rect.left)) - feather));
    const top = Math.max(0, Math.floor(Math.min(...regions.map((rect) => rect.top)) - feather));
    const right = Math.min(width, Math.ceil(Math.max(...regions.map((rect) => rect.right)) + feather));
    const bottom = Math.min(height, Math.ceil(Math.max(...regions.map((rect) => rect.bottom)) + feather));
    const mask = copyMask?.mask ?? document.createElement('canvas');
    const columns = Math.ceil((right - left) * .5);
    const rows = Math.ceil((bottom - top) * .5);
    if (!columns || !rows) return undefined;
    mask.width = columns;
    mask.height = rows;
    const matte = mask.getContext('2d');
    if (!matte) return undefined;

    // Rasterize only the measured areas, then composite a single soft mask per frame.
    const pixels = matte.createImageData(columns, rows);
    const stepX = (right - left) / columns;
    const stepY = (bottom - top) / rows;
    for (const rect of regions) {
      const firstColumn = Math.max(0, Math.floor((rect.left - feather - left) / stepX));
      const lastColumn = Math.min(columns, Math.ceil((rect.right + feather - left) / stepX));
      const firstRow = Math.max(0, Math.floor((rect.top - feather - top) / stepY));
      const lastRow = Math.min(rows, Math.ceil((rect.bottom + feather - top) / stepY));
      for (let row = firstRow; row < lastRow; row++) {
        const y = top + (row + .5) * stepY;
        const dy = Math.max(rect.top - y, y - rect.bottom, 0);
        for (let column = firstColumn; column < lastColumn; column++) {
          const x = left + (column + .5) * stepX;
          const dx = Math.max(rect.left - x, x - rect.right, 0);
          const strength = rect.opacity * (1 - ease(Math.sqrt(dx * dx + dy * dy) / feather));
          const index = (row * columns + column) * 4 + 3;
          pixels.data[index] = Math.max(pixels.data[index], Math.round(strength * 255));
        }
      }
    }
    matte.putImageData(pixels, 0, 0);
    return { mask, left, top, width: right - left, height: bottom - top };
  }

  function positionBiomarkerCopy() {
    if (theme !== 'biomarkers' || !viewport) return;
    copyNeedsMeasure = false;
    const screen = panes?.querySelector('[data-screen]:not([hidden])');
    const heading = screen?.querySelector('h1');
    viewport.copyTop = heading?.getBoundingClientRect().top ?? viewport.height * .36;
    viewport.headerBottom = (header?.getBoundingClientRect().bottom ?? 48) + 8;
    if (!screen) return;

    const regions = [];
    const add = (box, opacity, clip) => {
      if (!box.width || !box.height) return;
      const left = Math.max(0, box.left - 3, clip?.left ?? 0);
      const top = Math.max(0, box.top - 2, clip?.top ?? 0);
      const right = Math.min(viewport.width, box.right + 3, clip?.right ?? viewport.width);
      const bottom = Math.min(viewport.height, box.bottom + 2, clip?.bottom ?? viewport.height);
      if (left < right && top < bottom) regions.push({ left, top, right, bottom, opacity });
    };
    const scrollBounds = screen.querySelector('.detail-scroll')?.getBoundingClientRect();
    for (const copy of screen.querySelectorAll('h1, .screen-heading p, .detail-copy p')) {
      for (const line of textBounds(copy)) add(line, .88, scrollBounds);
    }
    const controls = '.home-actions button, .step-actions button, .browse-intents, .list-link, #test-search, .detail-action, .detail-kit-toggle';
    for (const control of screen.querySelectorAll(controls)) {
      const clip = control.closest('.detail-scroll') ? scrollBounds : undefined;
      add(control.getBoundingClientRect(), .74, clip);
    }
    copyMask = makeCopyMask(regions, viewport.width, viewport.height);
  }

  function applyCopyMask() {
    if (!copyMask) return;
    const { mask, left, top, width, height } = copyMask;
    context.save();
    context.globalAlpha = 1;
    context.globalCompositeOperation = 'destination-out';
    context.drawImage(mask, left, top, width, height);
    context.restore();
  }

  function invalidateBiomarkerCopy() {
    if (theme !== 'biomarkers' || !viewport) return;
    copyNeedsMeasure = true;
    if (reducedMotion.matches && !document.hidden) {
      positionBiomarkerCopy();
      draw(stillTime());
    }
  }

  function drawDevice(time, phase, state, paint) {
    if (!revealTarget || !field.devices) return;
    const rise = ease((phase - .40) / .18);
    if (!rise || phase >= .99) return;

    const { x: targetX, y: targetY, scale, opacity, method } = revealTarget;
    const travel = ease((phase - .46) / .23);
    const scatter = ease((phase - .78) / .21);
    const alternate = Math.floor(time / duration + .30) % 2 === 0 ? 'saliva' : 'blood';
    const kind = method ?? alternate;
    const points = field.devices[kind];
    const orbital = phase * tau;
    const rotation = -.15 + travel * .11 + Math.sin(orbital * 2) * .09;
    const cosine = Math.cos(rotation);
    const sine = Math.sin(rotation);
    const rimX = state.centerX + state.scale * .94 * state.sine;
    const rimY = state.centerY - state.scale * .94 * state.cosine;
    const liftY = rimY + scale * (.44 - rise * 1.00);
    const centerX = rimX + (targetX - rimX) * travel;
    const centerY = liftY + (targetY - liftY) * travel
      - Math.sin(travel * Math.PI) * scale * .16 + Math.sin(orbital * 2) * travel * scale * .035;
    const usePhotoColors = theme === 'unboxing';
    const glass = kind === 'saliva';
    const size = Math.min(1.16, .72 + scale / 520);

    context.globalAlpha = Math.min(1, rise * 2.7) * (1 - scatter) * opacity * .98;
    for (let index = 0; index < points.length; index++) {
      const point = points[index];
      const px = point.x * cosine - point.y * sine;
      const py = point.x * sine + point.y * cosine;
      const angle = index * 2.399963;
      const x = centerX + scale * (px + scatter * Math.cos(angle) * .77);
      const y = centerY + scale * (py + scatter * Math.sin(angle) * .66);
      if (travel < .33 && y > rimY + (x - rimX) * state.sine) continue;
      const throughGlass = glass && point.y > -.26 && Math.abs(point.x) < .092;
      paint(x, y, size * (throughGlass ? .72 : 1), point.tint, usePhotoColors ? point.color : null);
    }
  }

  function draw(time) {
    const { width, height, small, scale, centerX, centerY } = viewport;
    const previewUnboxing = isUnboxing(theme);
    const previewBiomarkers = theme === 'biomarkers';
    const colors = theme === 'unboxing-mono' ? blackAndWhite : palettes;

    context.clearRect(0, 0, width, height);
    let previousColor;
    function paint(x, y, size, tint, sourceColor) {
      if (x < 0 || x > width || y < 0 || y > height) return;
      const nextPaint = Math.min(colors.length - 1, Math.max(0, Math.floor(tint * colors.length)));
      const color = sourceColor ?? colors[nextPaint];
      if (color !== previousColor) {
        previousColor = color;
        context.fillStyle = color;
      }
      context.fillRect(x, y, size, size);
    }

    if (biomarkerDetail) {
      window.drawAlyxCortisol?.({ time, viewport, context, paint });
      applyCopyMask();
      return;
    }

    const ambientDuration = previewBiomarkers ? (window.alyxBiomarkerCycle ?? duration) / 2 : duration;
    const phase = (time / ambientDuration + (previewUnboxing ? .30 : initialPhase)) % 1;
    const orbital = phase * tau;
    const assembly = previewUnboxing
      ? ease((phase - .025) / .27) * (1 - ease((phase - .79) / .21))
      : ease((phase - .04) / .34) * (1 - ease((phase - .59) / .35));
    const lidLift = previewUnboxing ? ease((phase - .32) / .20) : 0;
    const flow = Math.sin(orbital);
    const pulse = Math.cos(orbital);
    const lean = .34 + flow * .105;
    const cosine = Math.cos(lean);
    const sine = Math.sin(lean);
    const tilt = .235 + pulse * .054;
    const eddy = Math.sin(assembly * Math.PI);

    context.globalAlpha = small ? .84 : .94;
    for (const point of field.ambient) {
      if (small && point.index >= (previewUnboxing || previewBiomarkers ? 3350 : 2520)) continue;
      const x = width * (point.x + flow * point.driftX + pulse * .006);
      const y = height * (point.y + pulse * point.driftY + flow * .005);
      paint(x, y, point.size * (small ? .96 : 1.13), point.tint);
    }

    if (previewBiomarkers) {
      if (biomarkerReady) window.drawAlyxBiomarkerSequence({ time, field, viewport, context, paint, ease });
      applyCopyMask();
      return;
    }

    context.globalAlpha = .35 + assembly * (small ? .52 : .6);
    for (const point of field.shell) {
      const elevated = point.height + point.z * tilt;
      const moveLid = point.lid ? lidLift : 0;
      const shellX = centerX + scale * (point.x * cosine - elevated * sine - moveLid * .23);
      const shellY = centerY + scale * (point.x * sine + elevated * cosine - moveLid * (.39 - point.x * .32));
      const freeX = width * (point.dispersedX + flow * .022 * point.curve);
      const freeY = height * (point.dispersedY + pulse * .038 * point.curve);
      const x = freeX + (shellX - freeX) * assembly + eddy * point.curve * width * .14;
      const y = freeY + (shellY - freeY) * assembly - eddy * point.glimmer * height * .075;
      const tint = point.tint + .10 * assembly - .16 * (1 - assembly);
      paint(x, y, point.size * (small ? 1.06 : 1.17), tint);
    }
    if (previewUnboxing) drawDevice(time, phase, { centerX, centerY, scale, sine, cosine }, paint);
  }

  function sizeField() {
    if (!context) return;
    const width = backdrop.clientWidth;
    const height = backdrop.clientHeight;
    if (!width || !height) return;
    const small = width <= 680;
    const pixelRatio = Math.min(window.devicePixelRatio || 1, small ? 1.3 : 1.4);
    const scale = small ? Math.min(width * .79, height * .344) : Math.min(width * .255, height * .354, 430);
    viewport = {
      width, height, small, scale,
      centerX: width * (small ? .60 : .71),
      centerY: height * (small ? .57 : .53),
    };
    canvas.width = Math.round(width * pixelRatio);
    canvas.height = Math.round(height * pixelRatio);
    context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    positionReveal();
    positionBiomarkerCopy();
    draw(reducedMotion.matches ? stillTime() : elapsed);
  }

  function stopAnimation() {
    if (frame) window.cancelAnimationFrame(frame);
    frame = undefined;
    timestamp = undefined;
  }

  function render(now) {
    const previous = timestamp ?? now;
    const delta = now - previous;
    if (delta >= frameInterval - 1 || timestamp === undefined) {
      timestamp = now;
      let cycle = duration;
      if (biomarkerDetail) cycle = window.alyxCortisolCycle ?? duration;
      else if (theme === 'biomarkers') cycle = window.alyxBiomarkerCycle ?? duration;
      else if (isUnboxing(theme)) cycle = duration * 2;
      elapsed = (elapsed + delta) % cycle;
      if (copyNeedsMeasure) positionBiomarkerCopy();
      if (viewport) draw(elapsed);
    }
    frame = window.requestAnimationFrame(render);
  }

  function loadParticleAsset(path) {
    const script = document.createElement('script');
    script.src = path;
    script.addEventListener('load', sync, { once: true });
    document.head.append(script);
    return script;
  }

  function sync() {
    backdrop.toggleAttribute('data-paused', document.hidden);
    if (!usesParticles(root.dataset.theme)) {
      stopAnimation();
      canvas?.remove();
      canvas = context = viewport = undefined;
      elapsed = 0;
      return;
    }
    if (theme !== root.dataset.theme) {
      theme = root.dataset.theme;
      copyMask = undefined;
      copyNeedsMeasure = false;
      field = particleField(theme !== 'particles');
      elapsed = 0;
      biomarkerReady = false;
      biomarkerDetail = theme === 'biomarkers' && detailScreen?.hidden === false;
    }

    if (!canvas) {
      canvas = document.createElement('canvas');
      canvas.className = 'theme-particles';
      canvas.setAttribute('aria-hidden', 'true');
      context = canvas.getContext('2d');
      if (!context) {
        canvas = undefined;
        return;
      }
      backdrop.append(canvas);
    }
    if (isUnboxing(theme)) {
      field.devices = window.alyxParticleDevices;
      if (!field.devices && !deviceScript) deviceScript = loadParticleAsset('media/particle-devices.js');
    }
    if (theme === 'biomarkers' && !window.drawAlyxBiomarkerSequence && !biomarkerScript) {
      biomarkerScript = loadParticleAsset('media/particle-biomarkers.js');
    }
    if (theme === 'biomarkers' && !biomarkerReady && window.drawAlyxBiomarkerSequence &&
        window.alyxParticleDeviceModels && window.alyxParticleMolecules?.cortisol) {
      biomarkerReady = true;
      if (!biomarkerDetail) elapsed = 0;
    }
    sizeField();

    if (document.hidden || reducedMotion.matches) {
      stopAnimation();
      if (viewport && reducedMotion.matches && !document.hidden) draw(stillTime());
    } else if (!frame) {
      frame = window.requestAnimationFrame(render);
    }
  }

  function stillTime() {
    if (theme === 'biomarkers') return biomarkerDetail ? 0 : window.alyxBiomarkerStill ?? 0;
    return isUnboxing(theme) ? duration * .35 : 0;
  }

  new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
  if (panes) {
    panes.addEventListener('scroll', invalidateBiomarkerCopy, { passive: true, capture: true });
    panes.addEventListener('animationend', invalidateBiomarkerCopy);
    new MutationObserver(() => {
      if (!context || !viewport) return;
      if (theme === 'biomarkers') {
        positionBiomarkerCopy();
        const showingDetail = detailScreen?.hidden === false;
        if (showingDetail !== biomarkerDetail) {
          biomarkerDetail = showingDetail;
          elapsed = 0;
        }
      } else if (isUnboxing(theme)) {
        positionReveal();
      } else {
        return;
      }
      draw(reducedMotion.matches ? stillTime() : elapsed);
    }).observe(panes, { subtree: true, attributes: true, attributeFilter: ['hidden', 'data-method'] });
  }
  window.addEventListener('resize', sizeField, { passive: true });
  reducedMotion.addEventListener('change', sync);
  document.addEventListener('visibilitychange', sync);
  sync();
})();

</script>
<script>
(() => {
  const form = document.querySelector('#gate-form');
  const input = form.querySelector('input');
  const submit = form.querySelector('button');
  const status = form.querySelector('[role="status"]');

  function showStatus(message, isError = false) {
    status.textContent = message;
    status.toggleAttribute('data-error', isError);
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (submit.disabled) return;
    const body = JSON.stringify({ password: input.value });
    input.value = '';
    input.removeAttribute('aria-invalid');
    input.disabled = true;
    submit.disabled = true;
    showStatus('Unlocking…');

    const controller = new AbortController();
    const timeout = window.setTimeout(() => controller.abort(), 15000);
    let storefront;
    let incorrect = false;
    try {
      const response = await fetch(form.action, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body,
        credentials: 'omit',
        cache: 'no-store',
        redirect: 'error',
        signal: controller.signal,
      });
      const mime = response.headers.get('content-type')?.split(';', 1)[0].trim().toLowerCase();
      if (response.ok && mime === 'text/html') {
        storefront = await response.text();
        if (!storefront.trim()) showStatus('Unable to unlock the site. Try again.', true);
      } else if (response.status === 401 || response.status === 403) {
        incorrect = true;
        showStatus('Incorrect password. Try again.', true);
      } else if (response.status === 429) {
        showStatus('Too many attempts. Try again shortly.', true);
      } else {
        showStatus('Unable to unlock the site. Try again.', true);
      }
    } catch {
      showStatus('Unable to unlock the site. Try again.', true);
    } finally {
      window.clearTimeout(timeout);
    }

    if (storefront?.trim()) {
      document.documentElement.removeAttribute('data-theme');
      document.dispatchEvent(new Event('visibilitychange'));
      document.open();
      document.write(storefront);
      document.close();
      return;
    }

    input.disabled = false;
    submit.disabled = false;
    if (incorrect) input.setAttribute('aria-invalid', 'true');
    input.focus();
  });

  input.disabled = false;
  submit.disabled = false;
})();
</script>
</body>
</html>
