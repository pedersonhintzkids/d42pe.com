<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mansion Party Tickets — D42PE</title>
  <meta
    name="description"
    content="50 discounted Mansion Party tickets at 50% off. Friday, July 24 in Austin."
  />
  <meta name="theme-color" content="#050506" />
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #fff7fa;
      background:
        radial-gradient(circle at 50% 15%, rgba(255, 47, 109, 0.17), transparent 28rem),
        #050506;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: min(100%, 620px);
      padding: clamp(28px, 6vw, 52px);
      border: 1px solid rgba(255, 104, 151, 0.28);
      border-radius: 22px;
      background: rgba(14, 12, 15, 0.88);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.58);
      text-align: center;
    }

    .brand {
      margin: 0 0 22px;
      color: #ff8aad;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 9vw, 66px);
      line-height: 0.98;
      letter-spacing: -0.05em;
      text-transform: uppercase;
    }

    .offer {
      margin: 22px 0 0;
      color: #ff8aad;
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 850;
    }

    .details {
      margin: 14px 0 0;
      color: #c9bbc1;
      font-size: 15px;
      font-weight: 720;
      line-height: 1.6;
      text-transform: uppercase;
    }

    .ticket-button {
      width: 100%;
      margin-top: 28px;
      padding: 17px 20px;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 104, 151, 0.48);
      border-radius: 14px;
      color: #d9c8cf;
      background: rgba(255, 47, 109, 0.1);
      font: inherit;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: not-allowed;
      opacity: 0.82;
      text-decoration: none;
    }

    .ticket-button.is-disabled { pointer-events: none; }

    .ticket-button.is-live {
      border-color: #ff2f6d;
      color: #fff;
      background: linear-gradient(135deg, #ff3d77, #b90d40);
      box-shadow: 0 12px 34px rgba(255, 47, 109, 0.28);
      cursor: pointer;
      opacity: 1;
    }

    .countdown-label {
      margin: 26px 0 7px;
      color: #a99ca2;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .countdown-time {
      margin: 0;
      color: #fff;
      font-size: clamp(28px, 8vw, 42px);
      font-weight: 950;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.1em;
      line-height: 1;
      text-shadow: 0 0 24px rgba(255, 47, 109, 0.32);
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #a99ca2;
      font-size: 13px;
      text-decoration: none;
    }

    .back:hover { color: #fff7fa; }
  </style>
</head>
<body>
  <main class="card">
    <p class="brand">D42PE × 512 Events</p>
    <h1 id="heading">Ticket Drop Coming</h1>
    <p class="offer">50 tickets at 50% off</p>
    <p class="details" id="details">Monday, July 20 • 6 PM CT<br />D42PE.com</p>
    <p class="countdown-label" id="countdown-label">Tickets open in</p>
    <p class="countdown-time" id="countdown-time" role="timer" aria-live="off">00:00:00</p>
    <a class="ticket-button is-disabled" id="ticket-button" aria-disabled="true" tabindex="-1">
      Tickets Drop Monday at 6 PM
    </a>
    <a class="back" href="/">Return to event details</a>
  </main>
  <script>
    const TICKET_URL = "https://www.universe.com/events/playboy-themed-mansion-party-austin-d42pe-tickets-R5XHPM?ref=Website";
    const LAUNCH_AT = Date.parse("2026-07-20T18:00:00-05:00");
    const heading = document.getElementById("heading");
    const details = document.getElementById("details");
    const countdownLabel = document.getElementById("countdown-label");
    const countdownTime = document.getElementById("countdown-time");
    const ticketButton = document.getElementById("ticket-button");
    let launchIsLive = false;
    let countdownTimer;

    function formatCountdown(milliseconds) {
      const totalSeconds = Math.max(0, Math.ceil(milliseconds / 1000));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      return [hours, minutes, seconds]
        .map((value) => String(value).padStart(2, "0"))
        .join(":");
    }

    function activateLaunch() {
      if (launchIsLive) return;
      launchIsLive = true;
      heading.textContent = "Tickets Live";
      details.innerHTML = "Friday, July 24 • 9 PM–2 AM<br />Austin, Texas • All Ages";
      countdownLabel.textContent = "Opening secure checkout";
      countdownTime.textContent = "Live now";
      ticketButton.href = TICKET_URL;
      ticketButton.classList.remove("is-disabled");
      ticketButton.classList.add("is-live");
      ticketButton.removeAttribute("aria-disabled");
      ticketButton.removeAttribute("tabindex");
      ticketButton.textContent = "Continue to Tickets";
      if (countdownTimer) window.clearInterval(countdownTimer);
      window.setTimeout(() => window.location.replace(TICKET_URL), 700);
    }

    function renderLaunchState(now = Date.now()) {
      const remaining = LAUNCH_AT - now;
      if (remaining <= 0) {
        activateLaunch();
        return "live";
      }
      countdownTime.textContent = formatCountdown(remaining);
      return "countdown";
    }

    if (renderLaunchState() === "countdown") {
      countdownTimer = window.setInterval(renderLaunchState, 1000);
    }
  </script>
</body>
</html>
