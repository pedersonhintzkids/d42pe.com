<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tickets Drop Monday at 6 PM — D42PE</title>
  <meta
    name="description"
    content="50 Mansion Party tickets drop for 50% off Monday, July 20 at 6 PM CT on D42PE.com."
  />
  <meta name="theme-color" content="#050506" />
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #fff7fa;
      background:
        radial-gradient(circle at 50% 15%, rgba(255, 47, 109, 0.17), transparent 28rem),
        #050506;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: min(100%, 620px);
      padding: clamp(28px, 6vw, 52px);
      border: 1px solid rgba(255, 104, 151, 0.28);
      border-radius: 22px;
      background: rgba(14, 12, 15, 0.88);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.58);
      text-align: center;
    }

    .brand {
      margin: 0 0 22px;
      color: #ff8aad;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 9vw, 66px);
      line-height: 0.98;
      letter-spacing: -0.05em;
      text-transform: uppercase;
    }

    .offer {
      margin: 22px 0 0;
      color: #ff8aad;
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 850;
    }

    .details {
      margin: 14px 0 0;
      color: #c9bbc1;
      font-size: 15px;
      font-weight: 720;
      line-height: 1.6;
      text-transform: uppercase;
    }

    .disabled-button {
      width: 100%;
      margin-top: 28px;
      padding: 17px 20px;
      border: 1px solid rgba(255, 104, 151, 0.48);
      border-radius: 14px;
      color: #d9c8cf;
      background: rgba(255, 47, 109, 0.1);
      font: inherit;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: not-allowed;
      opacity: 0.82;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #a99ca2;
      font-size: 13px;
      text-decoration: none;
    }

    .back:hover { color: #fff7fa; }
  </style>
</head>
<body>
  <main class="card">
    <p class="brand">D42PE × 512 Events</p>
    <h1>Ticket Drop Coming</h1>
    <p class="offer">50 tickets at 50% off</p>
    <p class="details">Monday, July 20 • 6 PM CT<br />D42PE.com</p>
    <button class="disabled-button" type="button" disabled>
      Tickets Drop Monday at 6 PM
    </button>
    <a class="back" href="/">Return to event details</a>
  </main>
</body>
</html>
