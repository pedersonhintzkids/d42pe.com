<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mansion Party Ticket Drop — D42PE</title>
  <meta
    name="description"
    content="50 Mansion Party tickets drop for 50% off Monday, July 20 at 6 PM CT on D42PE.com."
  />
  <meta name="theme-color" content="#050506" />

  <meta property="og:title" content="50 Ticket Drop — 50% Off" />
  <meta
    property="og:description"
    content="This Monday, July 20 at 6 PM CT on D42PE.com."
  />
  <meta property="og:image" content="https://d42pe.com/assets/mansion-party-drop.jpg" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://d42pe.com/" />

  <style>
    :root {
      color-scheme: dark;
      --bg: #050506;
      --panel: rgba(14, 12, 15, 0.88);
      --panel-soft: rgba(255, 255, 255, 0.035);
      --text: #fff7fa;
      --muted: #b8aeb3;
      --pink: #ff2f6d;
      --pink-light: #ff8aad;
      --line: rgba(255, 104, 151, 0.25);
      --max: 1180px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 78% 18%, rgba(255, 47, 109, 0.15), transparent 26rem),
        radial-gradient(circle at 8% 80%, rgba(147, 19, 57, 0.16), transparent 32rem),
        linear-gradient(145deg, #030304 0%, #080609 55%, #030304 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.22;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 86%);
    }

    a { color: inherit; text-decoration: none; }

    .wrap {
      width: min(calc(100% - 40px), var(--max));
      margin: 0 auto;
    }

    .nav {
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(5, 5, 6, 0.78);
      backdrop-filter: blur(18px);
    }

    .nav-inner {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.14em;
    }

    .brand-mark {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 18px rgba(255, 47, 109, 0.95);
    }

    .instagram {
      padding: 9px 14px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 999px;
      color: #e9dfe3;
      font-size: 13px;
      font-weight: 750;
      transition: border-color 160ms ease, background 160ms ease;
    }

    .instagram:hover {
      border-color: var(--pink);
      background: rgba(255, 47, 109, 0.08);
    }

    .hero {
      min-height: calc(100vh - 70px);
      padding: 54px 0 44px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(340px, 0.78fr);
      align-items: center;
      gap: clamp(36px, 6vw, 86px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      color: var(--pink-light);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 34px;
      height: 1px;
      background: var(--pink);
      box-shadow: 0 0 10px rgba(255, 47, 109, 0.7);
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(44px, 7.2vw, 92px);
      line-height: 0.92;
      letter-spacing: -0.055em;
      text-transform: uppercase;
    }

    h1 span {
      color: transparent;
      -webkit-text-stroke: 1.5px var(--pink-light);
      text-shadow: 0 0 28px rgba(255, 47, 109, 0.18);
    }

    .offer {
      margin: 24px 0 0;
      color: #f7eaf0;
      font-size: clamp(19px, 2.2vw, 27px);
      font-weight: 760;
      line-height: 1.35;
    }

    .offer strong { color: var(--pink-light); }

    .details {
      margin: 32px 0 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      background: var(--panel-soft);
    }

    .detail {
      min-height: 100px;
      padding: 20px;
    }

    .detail:nth-child(odd) { border-right: 1px solid var(--line); }
    .detail:nth-child(-n + 2) { border-bottom: 1px solid var(--line); }

    .detail-label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.17em;
      text-transform: uppercase;
    }

    .detail-value {
      font-size: 15px;
      font-weight: 840;
      line-height: 1.35;
      text-transform: uppercase;
    }

    .ticket-button {
      width: 100%;
      margin-top: 18px;
      padding: 17px 22px;
      border: 1px solid rgba(255, 104, 151, 0.5);
      border-radius: 14px;
      color: #d9c8cf;
      background:
        linear-gradient(135deg, rgba(255, 47, 109, 0.12), rgba(255, 255, 255, 0.025));
      font: inherit;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: not-allowed;
      opacity: 0.82;
    }

    .drop-note {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .flyer-wrap {
      position: relative;
      width: min(100%, 500px);
      justify-self: end;
    }

    .flyer-wrap::before {
      content: "";
      position: absolute;
      inset: 8% -8% -4% 8%;
      z-index: -1;
      border-radius: 40px;
      background: rgba(255, 47, 109, 0.18);
      filter: blur(52px);
    }

    .flyer {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid rgba(255, 104, 151, 0.34);
      border-radius: 18px;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.6),
        0 0 0 7px rgba(255, 255, 255, 0.025);
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 22px 0 28px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      color: #93878d;
      font-size: 12px;
    }

    @media (max-width: 850px) {
      .hero {
        padding-top: 42px;
        grid-template-columns: 1fr;
      }

      .content { order: 1; }

      .flyer-wrap {
        order: 2;
        width: min(100%, 620px);
        justify-self: center;
      }
    }

    @media (max-width: 520px) {
      .wrap { width: min(calc(100% - 28px), var(--max)); }
      .nav-inner { min-height: 62px; }
      .instagram { padding: 8px 11px; }
      .hero { min-height: auto; padding: 34px 0 38px; gap: 34px; }
      h1 { font-size: clamp(42px, 14vw, 64px); }
      .details { grid-template-columns: 1fr; }
      .detail { min-height: auto; padding: 17px; }
      .detail:nth-child(odd) { border-right: 0; }
      .detail:not(:last-child) { border-bottom: 1px solid var(--line); }
      footer { flex-direction: column; gap: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>

<body>
  <header class="nav">
    <div class="nav-inner wrap">
      <a class="brand" href="/" aria-label="D42PE home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>D42PE</span>
      </a>
      <a
        class="instagram"
        href="https://www.instagram.com/d42pe.events_atx/"
        target="_blank"
        rel="noopener noreferrer"
      >Instagram</a>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="content">
        <div class="eyebrow">512 Events × D42PE</div>
        <h1>Mansion Party <span>Ticket Drop</span></h1>
        <p class="offer"><strong>50 tickets. 50% off.</strong><br />Dropping this Monday.</p>

        <div class="details" aria-label="Drop and event details">
          <div class="detail">
            <span class="detail-label">Ticket drop</span>
            <span class="detail-value">Monday, July 20<br />6 PM CT</span>
          </div>
          <div class="detail">
            <span class="detail-label">Event</span>
            <span class="detail-value">Friday, July 24<br />9 PM–2 AM</span>
          </div>
          <div class="detail">
            <span class="detail-label">Location</span>
            <span class="detail-value">Austin, Texas</span>
          </div>
          <div class="detail">
            <span class="detail-label">Entry</span>
            <span class="detail-value">All Ages</span>
          </div>
        </div>

        <button class="ticket-button" type="button" disabled>
          Tickets Drop Monday at 6 PM
        </button>
        <p class="drop-note">50 discounted tickets available at 50% off</p>
      </div>

      <div class="flyer-wrap">
        <img
          class="flyer"
          src="/assets/mansion-party-drop.jpg"
          alt="Mansion Party ticket drop flyer: 50 tickets at 50% off Monday, July 20 at 6 PM"
          width="1122"
          height="1402"
          fetchpriority="high"
        />
      </div>
    </section>

    <footer>
      <span>© <span id="year"></span> D42PE</span>
      <span>contact@d42pe.com</span>
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
