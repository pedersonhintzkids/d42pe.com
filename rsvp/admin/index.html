<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RSVP Organizer List | D42PE</title>
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#07090d">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' https://*.workers.dev; base-uri 'none'; form-action 'self'; object-src 'none'; frame-src 'none'">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/rsvp/admin/admin.css">
  <script src="/rsvp/config.js"></script>
  <script type="module" src="/rsvp/admin/admin.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to organizer list</a>
  <main class="admin-shell" id="main-content">
    <header class="admin-header">
      <div>
        <p class="eyebrow">D42PE • PRIVATE</p>
        <h1>RSVP ORGANIZER LIST</h1>
      </div>
      <button class="text-button" id="lock-admin" type="button" hidden>LOCK</button>
    </header>

    <section class="auth-panel" id="auth-panel" aria-labelledby="auth-title">
      <h2 id="auth-title">Enter the organizer secret</h2>
      <p>The secret is checked by the RSVP server and is kept only in this open tab.</p>
      <form id="auth-form" method="post">
        <label for="admin-secret">ORGANIZER SECRET</label>
        <input id="admin-secret" type="password" autocomplete="current-password" required>
        <button class="admin-button primary" id="unlock-admin" type="submit">OPEN RSVP LIST</button>
      </form>
      <p class="message error" id="auth-error" role="alert"></p>
    </section>

    <section class="list-panel" id="list-panel" aria-labelledby="list-title" hidden>
      <div class="list-heading">
        <div>
          <p class="eyebrow">RITUAL X • 8/29/26</p>
          <h2 id="list-title">ATTENDEES</h2>
        </div>
        <button class="admin-button" id="export-csv" type="button">EXPORT CSV</button>
      </div>

      <dl class="counts" aria-label="RSVP counts">
        <div><dt>CONFIRMED</dt><dd id="confirmed-count">—</dd></div>
        <div><dt>STARTED</dt><dd id="started-count">—</dd></div>
        <div><dt>TOTAL</dt><dd id="total-count">—</dd></div>
      </dl>

      <form class="filters" id="filters-form" role="search">
        <label for="status-filter">STATUS</label>
        <select id="status-filter" name="status">
          <option value="all">All</option>
          <option value="self_confirmed">Confirmed</option>
          <option value="started">Started / incomplete</option>
        </select>

        <label for="name-search">SEARCH NAME</label>
        <input id="name-search" name="search" type="search" autocomplete="off" maxlength="80">
        <button class="admin-button" type="submit">APPLY FILTERS</button>
      </form>

      <p class="message" id="list-status" role="status"></p>
      <p class="message error" id="list-error" role="alert"></p>

      <div class="table-wrap" id="table-wrap" hidden>
        <table>
          <caption class="visually-hidden">RITUAL X RSVP records</caption>
          <thead>
            <tr>
              <th scope="col">NAME</th>
              <th scope="col">STATUS</th>
              <th scope="col">CREATED</th>
              <th scope="col">SMS OPENED</th>
              <th scope="col">CONFIRMED</th>
              <th scope="col">SOURCE</th>
            </tr>
          </thead>
          <tbody id="rsvp-rows"></tbody>
        </table>
      </div>
      <div class="load-more-wrap">
        <button class="admin-button" id="load-more" type="button" hidden>LOAD MORE</button>
      </div>
    </section>
  </main>
</body>
</html>
